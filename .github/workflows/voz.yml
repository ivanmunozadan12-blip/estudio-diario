name: Voces (Chatterbox en GitHub)
# Si hay frases pendientes y el PC de casa no esta activo, un servidor de GitHub las convierte en voz.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      prueba:
        description: 'Solo generar muestras de voz de prueba'
        type: boolean
        default: false
      acento:
        description: 'Prueba de acento (Chatterbox y Qwen)'
        type: boolean
        default: false
      acento2:
        description: 'Acento: Qwen con texto de referencia'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: voz
  cancel-in-progress: false
jobs:
  voz:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Hay frases pendientes y el PC no esta activo?
        id: check
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_KEY }}
          PRUEBA: ${{ inputs.prueba }}
          ACENTO: ${{ inputs.acento }}
          ACENTO2: ${{ inputs.acento2 }}
        run: |
          echo "run=no" >> "$GITHUB_OUTPUT"
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Faltan los secretos SUPABASE_URL y SUPABASE_KEY"; exit 0; fi
          if [ "$ACENTO2" = "true" ]; then echo "acento2=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$ACENTO" = "true" ]; then echo "acento=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$PRUEBA" = "true" ]; then echo "run=yes" >> "$GITHUB_OUTPUT"; echo 'modo prueba'; exit 0; fi
          URL="${URL%/}"
          H=(-H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          LIM=$(date -u -d '25 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          curl -s -X PATCH "$URL/rest/v1/voz_jobs?status=eq.working&updated_at=lt.$LIM" "${H[@]}" -H 'Content-Type: application/json' -d '{"status":"pending"}' >/dev/null || true
          PEND=$(curl -s "$URL/rest/v1/voz_jobs?select=key&status=eq.pending&key=neq.__latido__&limit=1" "${H[@]}" | jq 'if type=="array" then length else 0 end' 2>/dev/null || echo 0)
          HB=$(curl -s "$URL/rest/v1/voz_jobs?select=updated_at&key=eq.__latido__" "${H[@]}" | jq -r 'if type=="array" then (.[0].updated_at // empty) else empty end' 2>/dev/null || true)
          AGE=999999
          if [ -n "$HB" ]; then AGE=$(( $(date +%s) - $(date -d "$HB" +%s) )); fi
          echo "pendientes=$PEND, ultimo latido hace ${AGE}s"
          if [ "${PEND:-0}" -ge 1 ] && [ "$AGE" -gt 60 ]; then echo "run=yes" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.run == 'yes'
      - uses: actions/setup-python@v5
        if: steps.check.outputs.run == 'yes'
        with:
          python-version: '3.11'
      - name: Cache del modelo
        if: steps.check.outputs.run == 'yes'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: chatterbox-mtl-v1
      - name: Instalar dependencias
        if: steps.check.outputs.run == 'yes'
        run: |
          python -m venv /tmp/cb
          . /tmp/cb/bin/activate
          pip install --quiet torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet chatterbox-tts soundfile
          python -c "import torch, torchaudio; print('torch', torch.__version__, 'torchaudio', torchaudio.__version__)"
      - name: Generar voces
        if: steps.check.outputs.run == 'yes'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ONCE: '1'
          WORKER_NAME: GitHub
          PRUEBA: ${{ inputs.prueba && '1' || '' }}
          PYTHONUNBUFFERED: '1'
        run: |
          . /tmp/cb/bin/activate
          python pc-voz/worker.py
      - uses: actions/checkout@v4
        if: steps.check.outputs.acento == 'yes'
      - uses: actions/setup-python@v5
        if: steps.check.outputs.acento == 'yes'
        with:
          python-version: '3.11'
      - name: Prueba de acento
        if: steps.check.outputs.acento == 'yes'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PYTHONUNBUFFERED: '1'
        run: |
          python -m venv /tmp/cb && . /tmp/cb/bin/activate
          pip install --quiet torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet chatterbox-tts soundfile
          python pc-voz/prueba_acento.py cb
          deactivate
          python -m venv /tmp/q && . /tmp/q/bin/activate
          pip install --quiet torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet qwen-tts soundfile
          python pc-voz/prueba_acento.py qwen
      - uses: actions/checkout@v4
        if: steps.check.outputs.acento2 == 'yes'
      - uses: actions/setup-python@v5
        if: steps.check.outputs.acento2 == 'yes'
        with:
          python-version: '3.11'
      - name: Acento con Qwen y texto de referencia
        if: steps.check.outputs.acento2 == 'yes'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PYTHONUNBUFFERED: '1'
          SOLO: casero,vecina,madre
        run: |
          python -m venv /tmp/q && . /tmp/q/bin/activate
          pip install --quiet torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet qwen-tts soundfile faster-whisper
          python pc-voz/prueba_acento.py qwen2
