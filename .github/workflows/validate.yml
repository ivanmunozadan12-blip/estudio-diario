name: Validación del proyecto
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Validar todo el código y las configuraciones (sin APIs ni secretos)
        run: node ci/check.js
      - name: Probar validaciones de seguridad de Netlify (sin red)
        run: node ci/security.test.js
      - name: Comprobar arranque de la web en Chromium (sin generar vídeos)
        run: node ci/smoke.js
      - name: Probar conversión y validación MP4 sin enviar a Telegram
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          mkdir -p out
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i color=c=black:s=360x640:r=30:d=6 -f lavfi -i sine=frequency=440:duration=6 -shortest -c:v libvpx-vp9 -deadline realtime -cpu-used 8 -c:a libopus out/raw.webm
          printf 'Vídeo de prueba local\n\nSin publicación ni envío.' > out/caption.txt
          bash ci/send.sh
          test -s out/video.mp4
