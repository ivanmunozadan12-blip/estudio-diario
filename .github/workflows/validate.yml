name: Validación del proyecto
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Validar todo el código y las configuraciones (sin APIs ni secretos)
        run: node ci/check.js
      - name: Probar validaciones de seguridad de Netlify (sin red)
        run: node ci/security.test.js
      - name: Probar protocolo de subida reanudable de YouTube (simulado)
        run: node ci/youtube-upload.test.js
      - name: Comprobar arranque de la web en Chromium (sin generar vídeos)
        run: node ci/smoke.js
      - name: Probar render real con Gemini y Piper simulados (sin cuota ni red)
        env:
          CI_MOCK: ci/mock.js
          GEMINI_API_KEY: CI_MOCK_DUMMY_KEY
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          mkdir -p site
          cp index.html manifest.webmanifest icon-192.png icon-512.png site/
          node ci/generate.js 0 "$(TZ=Europe/Madrid date +%F)"
          bash ci/send.sh
          test -s out/video.mp4
